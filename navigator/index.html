    html += '<div class="card"><p class="eyebrow">Session done</p><h1>' + (R.total ? 'Nice work.' : 'No questions matched') + '</h1>';
    if (R.total) {
      html += '<p class="lede">' + R.total + ' question' + (R.total === 1 ? '' : 's') + '. Every partial and miss was repeated until you graded it "Got it". First tries: <b class="t-got">' + R.first.got + ' got</b>, <b class="t-part">' + R.first.part + ' partial</b>, <b class="t-miss">' + R.first.miss + ' missed</b>.</p>';
      var hard = Object.keys(R.first.byId).filter(function (k) { return R.first.byId[k] !== 'got'; });
      if (hard.length) html += '<p class="lbl">Didn\'t get on the first try</p><ul class="why">' + hard.map(function (k) { var s = SG_BY_ID[k]; return '<li>Mod ' + s.m + ' Q' + s.n + ' — ' + esc(s.q) + '</li>'; }).join('') + '</ul>';
    } else html += '<p class="lede">Change the module or "Which questions" settings.</p>';
    html += '<div class="navrow"><a class="btn primary" href="#/sg/go">Start another session</a><a class="btn" href="#/sg">Settings</a></div></div>';
    app.innerHTML = html; return;
  }
  var s = SG_BY_ID[R.queue[0]], again = R.log[s.id];
  html += '<div class="card dq sgq"><p class="eyebrow">Module ' + s.m + ' · ' + esc(MOD_NAME[s.m]) + ' · Study guide Q' + s.n + (again ? ' · <span class="again">again</span>' : '') + '</p>';
  html += '<div class="qbig qmed">' + esc(s.q) + '</div>' + (s.x ? '<p class="hint flag">Marked on the study guide as not in the recorded lecture — answer comes from the slides/textbook.</p>' : '');
  if (!R.revealed) {
    html += '<textarea id="sgAns" rows="4" placeholder="Type your answer, or say it out loud — then reveal.">' + esc(R.typed) + '</textarea>';
    html += '<div class="navrow sgbtns"><button type="button" class="btn primary" id="sgReveal">Reveal answer <span class="kbd">(Ctrl+Enter)</span></button><a class="btn ghost small" href="#/notes/m' + s.m + '">Peek at notes</a></div>';
  } else {
    if (R.typed.trim()) html += '<p class="lbl">Your answer</p><div class="yours">' + esc(R.typed).replace(/\n/g, '<br>') + '</div>';
    html += '<p class="lbl">Study guide answer — check off what you got</p><ul class="keypts">' + s.a.map(function (b, i) { return '<li><label><input type="checkbox" data-k="' + i + '"><span>' + b + '</span></label></li>'; }).join('') + '</ul>';
    html += '<p class="lbl">How did you do?</p><div class="grade"><button type="button" class="g-got" data-g="got"><span class="k">1</span>Got it</button><button type="button" class="g-part" data-g="part"><span class="k">2</span>Partial</button><button type="button" class="g-miss" data-g="miss"><span class="k">3</span>Missed</button></div><p class="hint" id="sgSuggest"></p>';
  }
  html += '</div>';
  app.innerHTML = html;
  if (!R.revealed) {
    var ta = document.getElementById('sgAns');
    ta.addEventListener('input', function () { R.typed = ta.value; });
    ta.addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sgReveal(); } });
    if (window.matchMedia('(pointer:fine)').matches) ta.focus();
    document.getElementById('sgReveal').addEventListener('click', sgReveal);
  } else {
    var boxes = app.querySelectorAll('.keypts input'), sug = document.getElementById('sgSuggest');
    boxes.forEach(function (b) { b.addEventListener('change', function () {
      var n = Array.prototype.filter.call(boxes, function (x) { return x.checked; }).length, t = boxes.length;
      sug.textContent = n === t ? 'You checked every point → Got it.' : n === 0 ? '' : n + ' of ' + t + ' points → probably Partial.';
    }); });
    app.querySelectorAll('.grade button').forEach(function (b) { b.addEventListener('click', function () { sgGrade(b.dataset.g); }); });
  }
}
function sgReveal() { var R = SGS.run, ta = document.getElementById('sgAns'); if (ta) R.typed = ta.value; R.revealed = true; renderSGRun(); window.scrollTo(0, 0); }
function sgGrade(g) {
  var R = SGS.run, id = R.queue.shift();
  if (!R.first) R.first = { got: 0, part: 0, miss: 0, byId: {} };
  if (!(id in R.first.byId)) { R.first.byId[id] = g; R.first[g]++; }
  R.tally[g]++; R.log[id] = g; sgSaveGrade(id, g);
  if (g === 'miss') R.queue.splice(Math.min(3, R.queue.length), 0, id);
  else if (g === 'part') R.queue.splice(Math.min(5, R.queue.length), 0, id);
  R.revealed = false; R.typed = '';
  renderSGRun(); window.scrollTo(0, 0);
}
document.addEventListener('keydown', function (e) {
  if (!SGS.run || location.hash.indexOf('#/sg/run') !== 0 || !SGS.run.revealed) return;
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName) && e.target.type !== 'checkbox') return;
  var map = { '1': 'got', '2': 'part', '3': 'miss' };
  if (map[e.key]) { e.preventDefault(); sgGrade(map[e.key]); }
});


</script>
</body>
