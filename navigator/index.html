<style>

}

  --accent:#B99BD0; --accent-soft:#2E2538; --ok:#9BD8A6; --ok-bg:#1A2E1F; --bad:#F0A6B6; --bad-bg:#3A1D25;
  --warn-bg:#352A12; --warn-ink:#F1CF86;

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.ghost{background:transparent}

.hero{padding:18px 2px 8px}

<script>
/* ================= MICRO ENGINE (sequences, genetic code) ================= */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function rnd(a) { return a[Math.floor(Math.random() * a.length)]; }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

/* Universal genetic code (the codon chart used in lecture), order U C A G */
var CODE_B = 'UCAG';
var CODE_AA = 'FFLLSSSSYY**CC*WLLLLPPPPHHQQRRRRIIIMTTTTNNKKSSRRVVVVAAAADDEEGGGG';
var AA_NAME = { F: ['Phe', 'Phenylalanine'], L: ['Leu', 'Leucine'], S: ['Ser', 'Serine'], Y: ['Tyr', 'Tyrosine'], C: ['Cys', 'Cysteine'], W: ['Trp', 'Tryptophan'], P: ['Pro', 'Proline'], H: ['His', 'Histidine'], Q: ['Gln', 'Glutamine'], R: ['Arg', 'Arginine'], I: ['Ile', 'Isoleucine'], M: ['Met', 'Methionine'], T: ['Thr', 'Threonine'], N: ['Asn', 'Asparagine'], K: ['Lys', 'Lysine'], V: ['Val', 'Valine'], A: ['Ala', 'Alanine'], D: ['Asp', 'Aspartate'], E: ['Glu', 'Glutamate'], G: ['Gly', 'Glycine'], '*': ['Stop', 'Stop'] };
var CODON = {};
(function () { var i = 0; for (var a = 0; a < 4; a++) for (var b = 0; b < 4; b++) for (var c = 0; c < 4; c++) CODON[CODE_B[a] + CODE_B[b] + CODE_B[c]] = CODE_AA[i++]; })();
function aa3(code) { return AA_NAME[code][0]; }
function aaFull(code) { return code === '*' ? 'Stop' : AA_NAME[code][1] + ' (' + AA_NAME[code][0] + ')'; }

var DNA_COMP = { A: 'T', T: 'A', G: 'C', C: 'G' };
var RNA_FROM_TEMPLATE = { A: 'U', T: 'A', G: 'C', C: 'G' };
var RNA_COMP = { A: 'U', U: 'A', G: 'C', C: 'G' };
function cleanSeq(s) { return String(s || '').toUpperCase().replace(/[^ACGTU]/g, ''); }
function triplets(s) { return (s.match(/.{1,3}/g) || []).join(' '); }

/* translate an mRNA read 5'->3': start at first AUG, stop at stop codon */
function translateMRNA(m) {
  var start = m.indexOf('AUG');
  if (start < 0) return { error: 'No AUG start codon found — translation never begins.' };
  var codons = [], aas = [], stopped = false;
  for (var i = start; i + 3 <= m.length; i += 3) {
    var c = m.substr(i, 3), a = CODON[c];
    codons.push(c); aas.push(a);
    if (a === '*') { stopped = true; break; }
  }
  return { start: start, lead: m.slice(0, start), codons: codons, aas: aas, stopped: stopped, leftover: stopped ? '' : m.slice(start + codons.length * 3) };
}
function proteinStr(aas) { return aas.map(aa3).join('–'); }
function anticodon(c) { return c.split('').map(function (x) { return RNA_COMP[x]; }).join(''); }

/* base percentages (A=T, G=C) */
function basePct(base, pct) {
  var pair = { A: 'T', T: 'A', G: 'C', C: 'G' }[base];
  var other = (base === 'A' || base === 'T') ? ['G', 'C'] : ['A', 'T'];
  var rest = (100 - 2 * pct) / 2, r = {};
  r[base] = pct; r[pair] = pct; r[other[0]] = rest; r[other[1]] = rest;
  return { r: r, pair: pair, other: other, rest: rest };
}

/* mutation classifier: two coding strands (5'->3') */
function codingToMRNA(s) { return s.replace(/T/g, 'U'); }
function classifyMutation(orig, mut) {
  var o = translateMRNA(codingToMRNA(orig)), m = translateMRNA(codingToMRNA(mut));
  if (o.error) return { error: 'Original: ' + o.error };
  var res = { o: o, m: m };
  if (orig.length !== mut.length) {
    var d = mut.length - orig.length;
    res.kind = 'Frameshift ' + (d > 0 ? 'insertion' : 'deletion');
    res.why = (d > 0 ? Math.abs(d) + ' nucleotide(s) inserted' : Math.abs(d) + ' nucleotide(s) deleted') + ' → the reading frame shifts, so every codon after it is read differently.';
    if (Math.abs(d) % 3 === 0) res.note = 'The length changed by a multiple of 3, so the frame actually lines back up after the change. The class only names insertions/deletions that shift the frame.';
    return res;
  }
  var diffs = [];
  for (var i = 0; i < orig.length; i++) if (orig[i] !== mut[i]) diffs.push(i);
  if (!diffs.length) return { error: 'The two sequences are identical — nothing changed.' };
  res.diffs = diffs;
  if (m.error) { res.kind = 'Substitution (start codon destroyed)'; res.why = 'The change removed the AUG start codon, so translation can\'t start there.'; return res; }
  var po = o.aas.join(''), pm = m.aas.join('');
  if (po === pm) { res.kind = 'Silent'; res.why = 'Substitution, but the new codon codes for the same amino acid — the protein is unchanged.'; }
  else if (pm.indexOf('*') >= 0 && pm.indexOf('*') < (po.indexOf('*') < 0 ? po.length : po.indexOf('*'))) { res.kind = 'Nonsense'; res.why = 'Substitution that turns a codon into a premature STOP — the protein is cut short.'; }
  else { res.kind = 'Missense'; res.why = 'Substitution that changes one amino acid into a different amino acid.'; }
  if (diffs.length > 1) res.note = diffs.length + ' positions changed — a point mutation changes only ONE nucleotide.';
  return res;
}

  he_round: { title: 'Round (roundworm) → Nematode', notes: 'm11', result: 'NEMATODE',
    steps: ['Round (fluid-filled <b>hydrostatic skeleton</b>), <b>not segmented</b>; complex body systems (mouth, digestive tract); many have separate males and females. Most harmless (soil aerators); some cause common worldwide disease. Hookworms are roundworms.', '<i>Ascaris</i> (intestinal roundworm): eggs ingested → hatch in gut → larvae enter blood → lungs → coughed up the trachea and swallowed → adults in intestines.', '<i>Enterobius</i> = pinworm · <i>Dirofilaria</i> = heartworm · <i>Dracunculus</i> = Guinea worm.', '<i>C. elegans</i>: free-living model organism — 959 adult cells (eutely), 131 programmed cell deaths, 302 neurons.'],
    watch: ['Instructor slides: ascariasis (<i>Ascaris</i>, a nematode) is treated with <b>albendazole (Albenza)</b> or mebendazole (Vermox). Which groups pyrantel and ivermectin target isn\'t in any of the provided materials — ask your professor.'] },
  helminthorg: { title: 'Helminth organisms & how they spread', hint: 'Ascaris, pinworm, heartworm, Guinea worm, C. elegans', notes: 'm11',
    steps: ['<i>Ascaris</i> (intestinal roundworm, ~1 ft, pencil-thick): eggs swallowed → hatch in gut → larvae need lots of O₂, so they enter blood → <b>lungs</b> → carried up the trachea (ciliary escalator) and swallowed → adults grow, mate, and can <b>block the intestines</b>. Disease: ascariasis.', '<i>Enterobius</i> (pinworm; males 2–5 mm, females 8–13 mm): eggs collect around the anus → <b>Scotch-tape test</b>. Chitin teeth latch on and drink blood.', '<i>Dirofilaria</i> (heartworm, dogs/cats): spread by <b>mosquitoes</b>; worms clog the heart, valves, and big vessels.', '<i>Dracunculus</i> (Guinea worm): from contaminated water; clogs lymphatics; pulled out slowly by winding on a stick (possible origin of the caduceus).', 'Blood feeders make <b>anticoagulants</b> in saliva so blood won\'t clot; e.g., <b>hirudin</b> is used as a blood thinner.', '<b>Helminthic therapy</b>: worms suppress inflammation → researched for allergies, Crohn\'s, IBS. <b>David Pritchard</b> (slides): injected himself with 50 hookworms; 10 was the "magic number."', '<i>C. elegans</i>: harmless model nematode — 959 adult cells (eutely), 131 programmed cell deaths, 302 neurons; used to study development, cell death, and nervous systems.'] },
  vector: { title: 'Mechanical or biological vector?', hint: 'arthropods spreading disease', q: 'Does the pathogen reproduce inside the arthropod?', opts: ['ve_bio', 've_mech'] },
  ve_bio: { title: 'Yes → biological vector', notes: 'm11', result: 'BIOLOGICAL', steps: ['The pathogen reproduces inside the vector.', 'Examples: mosquito → malaria; tick → Lyme disease.', 'Both squirt out the watery part of the blood so they can drink more. The vector doesn\'t cause the disease (the mosquito doesn\'t cause malaria — <i>Plasmodium</i> does).'] },
  ve_mech: { title: 'No, it just carries it → mechanical vector', notes: 'm11', result: 'MECHANICAL', steps: ['Carries pathogens on its body parts.', 'Example: house fly.'] },
  endo: { title: 'Endosymbiotic theory', hint: 'Lynn Margulis', notes: 'm9',
    steps: ['A large prokaryotic cell engulfed smaller bacteria that lived and reproduced inside it instead of being destroyed → they became organelles.', 'Photosynthetic bacteria → <b>chloroplasts</b>; aerobic bacteria → <b>mitochondria</b>.', 'Evidence: bacteria-like rod shape (1–10 µm), <b>double membrane</b>, <b>prokaryotic ribosomes</b>, <b>circular chromosome</b>, divide by <b>binary fission</b>, DNA similar to bacteria.', 'Proposed by <b>Lynn Margulis</b> (1960s, in her 20s); her paper "On the Origin of Mitosing Cells" was rejected by ~15 journals. Slides add eukaryotic <b>cilia</b> as another product of endosymbiosis.', 'Eukaryotic cells: 10–100 µm, compartmentalized, nucleus ("eukaryotic" = true nugget).'],
    watch: ['Timing differs between sources: the video says eukaryotes appear ~<b>2 billion</b> years ago; the instructor slides say ~<b>2.5 billion</b>. Ask which your professor wants.'] },
  drugs: { title: 'Match a drug to how it works', hint: 'all modules: Flagyl, Monistat, Vermox, Cipro, Tamiflu…', notes: 'm10',
    steps: ['<b>Metronidazole (Flagyl)</b> — blocks DNA synthesis in protozoans.', '<b>Chloroquine</b> — keeps <i>Plasmodium</i> trophozoites from degrading hemoglobin.', '<b>Miconazole (Monistat)</b> — inhibits <b>ergosterol</b> synthesis (fungal membrane).', '<b>Anidulafungin (Eraxis)</b> — inhibits fungal <b>cell wall (chitin)</b> synthesis.', '<b>Mebendazole (Vermox)</b> — inhibits sugar absorption in worms. <b>Albendazole (Albenza)</b> — slides list it for ascariasis (nematode).', '<b>Ciprofloxacin (Cipro)</b> — inhibits bacterial <b>DNA gyrase</b> → no uncoiling → no replication.', '<b>Oseltamivir (Tamiflu)</b> — <b>neuraminidase</b> inhibitor → blocks budding of flu viruses.', '<b>Remdesivir</b> — disrupts the viral <b>polymerase</b> (SARS-CoV-2).'],
    watch: ['Antifungals are hard to make because fungal and human cells are so alike. The two targets that differ: the chitin cell wall and ergosterol (we use cholesterol).'] },

  /* ---------- MOD 12: DNA ---------- */
  basepct: { title: 'Base-percentage problem', hint: '"25% adenine — what % cytosine?"', notes: 'm12', tool: 'basepct',
    steps: ['Its partner has the <b>same</b> %: A = T and G = C.', 'Add the pair, subtract from 100 → that\'s the other pair together.', 'Split the other pair evenly.', 'Slide examples: <i>E. coli</i> 25% A → C = 25%. <i>T. aquaticus</i> 34% G → T = 16%.'] },
  complement: { title: 'Write the complementary DNA strand', hint: 'A–T, G–C, antiparallel, 5′/3′', notes: 'm12', tool: 'complement',
    steps: ['Pair every base: <b>A ↔ T</b> (2 H-bonds), <b>G ↔ C</b> (3 H-bonds).', 'The strands are <b>antiparallel</b>: if yours is 5′→3′, the new one is 3′→5′.', '5′ end starts with a phosphate; 3′ end ends with an –OH.', 'Golden rule: nucleic acids are only <b>built 5′ → 3′</b>.'] },
  replenz: { title: 'Which replication enzyme does this job?', hint: 'gyrase · helicase · primase · polymerase · ligase', notes: 'm12',
    steps: ['<b>Gyrase</b> — uncoils supercoiled DNA. (Cipro blocks it.)', '<b>Helicase</b> — unzips and unwinds the double helix → replication fork.', '<b>Primase</b> — lays down a short <b>RNA primer</b>.', '<b>DNA polymerase</b> — adds complementary nucleotides 5′→3′, replaces primers with DNA, proofreads.', '<b>Ligase</b> — joins Okazaki fragments on the lagging strand.'],
    watch: ['Order they act: gyrase → helicase → primase → polymerase → ligase.', 'Only gyrase differs between bacteria and us — that\'s why Cipro is safe for human cells.'] },
  strands: { title: 'Leading vs lagging strand', hint: 'Okazaki fragments', notes: 'm12',
    steps: ['Polymerase and primase only build <b>5′ → 3′</b>.', '<b>Leading</b> strand: built continuously, toward the fork, following helicase.', '<b>Lagging</b> strand: built away from the fork in short <b>Okazaki fragments</b>, each with its own primer, joined by <b>ligase</b>.', 'Bacteria: replication starts at the <b>origin</b>; two helicases go opposite ways → two forks around the loop. Takes ~30 min — most of the generation time.', '<b>Semi-conservative</b>: each new helix = one old strand + one new strand.'] },
  dnaexp: { title: 'Which experiment showed what?', hint: 'Griffith · Avery · Hershey & Chase · Franklin', notes: 'm12',
    steps: ['<b>Griffith (1928)</b>: <i>S. pneumoniae</i> smooth (capsule, pathogenic) vs rough (harmless). Heat-killed S + live R → mouse died, live S recovered → something transformed R into S.', '<b>Avery (1944)</b>: same mix + <b>protease</b> → mouse still died; + <b>DNase</b> → mouse lived → <b>DNA is the genetic material</b>.', '<b>Hershey & Chase (1952)</b> (slides): T2 phage, ³⁵S protein vs ³²P DNA → only DNA entered the bacteria → confirmed DNA.', '<b>Rosalind Franklin</b>: X-ray crystallography, <b>Photo 51</b> → double helix.', '<b>Watson & Crick</b>: first paper describing DNA structure (built models); Nobel 1962.', '<b>Craig Venter</b>: helped sequence the human genome; first artificial genome (<i>Mycoplasma genitalium</i>, 521 genes).'] },
  genes: { title: 'Gene, genotype, phenotype, chromosomes', hint: 'definitions', notes: 'm12',
    steps: ['<b>Gene</b>: region of a chromosome that encodes the primary structure of a specific protein.', '<b>Genotype</b>: the genes / nucleotide sequences in the genome. <b>Phenotype</b>: physical, behavioral, metabolic properties that result from it (genotype → phenotype).', 'Prokaryotic chromosome: double-stranded, <b>circular</b>, usually <b>one</b>. Eukaryotic: double-stranded, <b>linear</b>, <b>many</b> (humans 46).', 'DNA: deoxyribose, A G C T, double-stranded. RNA: ribose, A G C U, single-stranded. Nucleotide = phosphate + 5-carbon sugar + nitrogenous base.'] },

  /* ---------- MOD 13: GENE EXPRESSION ---------- */
  express: { title: 'Go from DNA → mRNA → protein', hint: 'transcribe, then translate', q: 'What sequence were you given?', opts: ['ex_coding', 'ex_template', 'ex_mrna'] },
  ex_coding: { title: 'DNA coding strand (5′ → 3′)', notes: 'm13', tool: 'translate', preset: { k: 'coding', s: 'ATGGGAACTTAG' },
    steps: ['The coding strand has the <b>same sequence as the mRNA</b> — just change every <b>T → U</b>.', 'Read the mRNA 5′ → 3′ and find the first <b>AUG</b> (start, Met).', 'Split into triplets (codons) from AUG.', 'Look each codon up on the chart; stop at a stop codon (UAA, UAG, UGA).'] },
  ex_template: { title: 'DNA template / non-coding strand (3′ → 5′)', notes: 'm13', tool: 'translate', preset: { k: 'template', s: 'TACCCTTGAATC' },
    steps: ['RNA polymerase reads the template: write the <b>complement</b> — A→U, T→A, G→C, C→G.', 'Template is 3′→5′, so the mRNA comes out <b>5′→3′</b>.', 'Find the first AUG, split into codons, use the chart, stop at a stop codon.'] },
  ex_mrna: { title: 'mRNA (5′ → 3′)', notes: 'm13', tool: 'translate', preset: { k: 'mrna', s: 'GCUCGACAUGUUAGGUUUUAUGGCACUGUGAGACACAAAAA' },
    steps: ['Scan from the 5′ end until you hit <b>AUG</b>. Letters before it are not translated.', 'From AUG on, divide into codons of 3.', 'An AUG in the middle is just Met.', 'Stop at the first stop codon — no tRNA matches it.'],
    watch: ['Slide example: GCUCGAC<b>AUG</b>UUAGGUUUUAUGGCACUG<b>UGA</b>… → Met–Leu–Gly–Phe–Met–Ala–Leu.'] },
  codon: { title: 'Codon, anticodon, tRNA & stages', hint: 'transcription / translation stages', notes: 'm13', tool: 'translate', preset: { k: 'mrna', s: 'AUGAAGUUUGGCGCAUAA' },
    steps: ['<b>Codon</b>: 3 mRNA nucleotides → 1 amino acid. 64 codons, 20 amino acids.', '<b>Anticodon</b>: 3 nucleotides on tRNA, complementary to the codon (codon AUG ↔ anticodon UAC).', 'Transcription: <b>initiation</b> (RNA polymerase binds promoter) → <b>elongation</b> (builds mRNA off template) → <b>termination</b> (hits terminator, falls off).', 'Translation: <b>initiation</b> (ribosome + Met-tRNA at AUG) → <b>elongation</b> (tRNAs deliver amino acids, peptide bonds form) → <b>termination</b> (stop codon, polypeptide released).', 'Promoter = start of gene (upstream, A/T-rich); terminator = end (downstream, C/G-rich).'],
    watch: ['Going backwards (amino acid → exact codon) isn\'t possible except Met — most amino acids have several codons.'] },
  mutation: { title: 'Classify a mutation', hint: 'silent · missense · nonsense · frameshift', q: 'Did the number of nucleotides change?', opts: ['mu_frame', 'mu_sub'] },
  mu_frame: { title: 'Yes — a base was inserted or deleted', notes: 'm13', result: 'FRAMESHIFT', tool: 'mutation', preset: { o: 'ATGGGAACTTAG', m: 'ATGGTGAACTTAG' },
    steps: ['Insertion or deletion → the <b>reading frame shifts</b>.', 'Every codon after it is wrong → nonfunctional protein; can kill the cell.', 'Scantron analogy: skip one bubble and every answer after it is wrong.'] },
  mu_sub: { title: 'No — one base swapped (substitution)', q: 'What happened to that codon\'s amino acid?', opts: ['mu_silent', 'mu_miss', 'mu_non'] },
  mu_silent: { title: 'Same amino acid', notes: 'm13', result: 'SILENT', tool: 'mutation', preset: { o: 'ATGGGAACTTAG', m: 'ATGGGTACTTAG' }, steps: ['No change to the protein (several codons code for the same amino acid).'] },
  mu_miss: { title: 'A different amino acid', notes: 'm13', result: 'MISSENSE', tool: 'mutation', preset: { o: 'ATGGGAACTTAG', m: 'ATGGGACCTTAG' }, steps: ['One amino acid changes to another. Often tolerated in a long protein.'] },
  mu_non: { title: 'It became a stop codon', notes: 'm13', result: 'NONSENSE', tool: 'mutation', preset: { o: 'ATGGGAACTTAG', m: 'ATGTGAACTTAG' }, steps: ['Premature stop codon → the protein is cut short.'] },
  operon: { title: 'Is the operon ON or OFF?', hint: 'lac (inducible) · trp (repressible)', q: 'Which type of operon?', opts: ['op_ind', 'op_rep'] },
  op_ind: { title: 'Inducible (default OFF, like a lamp) — e.g., lac', q: 'Is the inducer (e.g., lactose) present?', opts: ['op_ind_y', 'op_ind_n'] },
  op_ind_y: { title: 'Yes — inducer present', notes: 'm13', result: 'ON', steps: ['The inducer binds the repressor and <b>changes its shape</b> → repressor inactive, falls off the operator.', 'RNA polymerase can bind the promoter → genes transcribed.', 'lac: lactase genes (lacZ, lacY, lacA) make enzymes that break down lactose.'] },
  op_ind_n: { title: 'No inducer', notes: 'm13', result: 'OFF', bad: true, steps: ['The regulatory gene always makes an <b>active repressor</b>.', 'Repressor binds the <b>operator</b>, blocking RNA polymerase from the promoter → no transcription.', 'lac: once the lactose is used up, the repressor goes back on — self-regulating.'] },
  op_rep: { title: 'Repressible (default ON, like a refrigerator) — e.g., trp', q: 'Is the corepressor present?', opts: ['op_rep_y', 'op_rep_n'] },
  op_rep_y: { title: 'Yes — corepressor present', notes: 'm13', result: 'OFF', bad: true, steps: ['(Instructor slides) The corepressor binds and <b>activates</b> the repressor.', 'Active repressor binds the operator → RNA polymerase blocked → genes off.'] },
  op_rep_n: { title: 'No corepressor', notes: 'm13', result: 'ON', steps: ['(Instructor slides) The repressor is made <b>inactive</b> (wrong shape) and can\'t bind the operator.', 'RNA polymerase transcribes the genes.'] },
  uv: { title: 'UV light, mutagens & thymine dimers', hint: 'why UV sterilizes', notes: 'm13',
    steps: ['Mutagens: <b>chemicals, radiation, viruses</b>.', 'UV makes two <b>adjacent thymines covalently bond</b> = <b>thymine dimer</b>; the DNA kinks.', 'When transcribed → frameshift errors. More exposure → more dimers → eventually an essential gene is hit and the cell dies.', '254 nm is the most germicidal; kills endospores too. In humans it can lead to skin cancer.'] },

  /* ---------- MOD 14: BIOTECH ---------- */
  hgt: { title: 'Horizontal vs vertical gene transfer', hint: 'plasmids', notes: 'm14',
    steps: ['<b>Vertical</b>: passed to the next generation (parents → offspring).', '<b>Horizontal</b>: passed <b>within a generation</b> between neighboring cells — bacteria do this.', '<b>Plasmid</b>: small loop of DNA separate from the chromosome, with accessory genes; bacteria swap plasmid copies.', 'Textbook: horizontal transfer happens by transformation, transduction, and <b>conjugation</b> (through a conjugation pilus).'] },
  recomb: { title: 'Make recombinant DNA', hint: 'restriction enzymes, sticky ends, ligase, insulin', notes: 'm14',
    steps: ['<b>Restriction enzymes</b> ("DNA scissors", from bacteria) cut DNA at a specific recognition sequence — EcoRI cuts <b>GAATTC</b>.', 'The zigzag cut leaves <b>sticky ends</b> (single-stranded overhangs). Cut both DNAs with the <b>same</b> enzyme so the ends match.', '<b>Ligase</b> ("DNA glue") seals the pieces together.', '<b>Paul Berg</b> (1970): first recombinant DNA (SV40 + lambda phage); refused to put it into <i>E. coli</i>.', '<b>Cohen & Boyer</b> (1973): first recombinant organism. Boyer + Swanson (Genentech) → <b>Humulin</b>, human insulin made by <i>E. coli</i>.'] },
  pcr: { title: 'PCR: steps, temperatures, ingredients', hint: 'denature 96° · anneal 55° · extend 72°', notes: 'm14',
    steps: ['<b>Denaturation ~94–96 °C</b> — heat separates the strands.', '<b>Annealing / priming ~55 °C</b> — primers bind the sequences flanking the target.', '<b>Extension ~72 °C</b> — Taq polymerase extends the primers.', 'Repeat <b>25–35 times</b> in a <b>thermal cycler</b>; copies grow exponentially.', 'Tube: template DNA, primers, nucleotides, DNA polymerase, buffers/MgCl₂. Only one enzyme — no helicase, primase, or ligase.', '<b>Taq polymerase</b> is thermostable, from <i>Thermus aquaticus</i> (Yellowstone hot springs). <b>Kary Mullis</b> invented PCR (Nobel 1993).'] },
  pcrdx: { title: 'Interpret a diagnostic PCR test', hint: 'positive or negative', q: 'Was the target sequence amplified?', opts: ['dx_pos', 'dx_neg'] },
  dx_pos: { title: 'Yes — copies were made', notes: 'm14', result: 'POSITIVE', bad: true, steps: ['Primers are designed to match a sequence <b>unique to the pathogen</b>.', 'They found that sequence in the sample, so it was amplified → the pathogen is present (e.g., COVID PCR test).'] },
  dx_neg: { title: 'No amplification', notes: 'm14', result: 'NEGATIVE', steps: ['The sample had no matching sequence, so the primers had nothing to bind.', 'Even after 40 cycles nothing is amplified → pathogen absent.'] },
  crispr: { title: 'CRISPR: knock-out or knock-in?', hint: 'Cas9 + guide RNA', q: 'After Cas9 cuts, did the scientists supply donor DNA?', opts: ['cr_in', 'cr_out'] },
  cr_in: { title: 'Yes — donor DNA with matching ends', notes: 'm14', result: 'KNOCK-IN', steps: ['The cell uses <b>homology-directed repair</b>, treating the donor DNA like the homologous chromosome.', 'It copies the donor\'s new sequence into the cut → new gene inserted / faulty gene corrected (e.g., cystic fibrosis gene in cells in a dish).'] },
  cr_out: { title: 'No donor DNA', notes: 'm14', result: 'KNOCK-OUT', bad: true, steps: ['The cell uses <b>non-homologous end joining</b>: glues in random nucleotides.', 'That mutation inactivates the gene.'],
    watch: ['Cas9 = enzyme that cuts DNA. Guide RNA = ~20-nucleotide target sequence that tells Cas9 where to cut; swap it to reprogram Cas9. Discovered by Doudna & Charpentier (Nobel 2020). CRISPR is naturally a bacterial immune system against phages.'] },
  germline: { title: 'CRISPR uses & germline editing rules', hint: 'what is allowed', notes: 'm14',
    steps: ['Uses: <b>sickle cell</b> treatment (Victoria Gray — first FDA-approved CRISPR therapy), T cells edited to fight lung cancer (Lu You), pig organs for transplant (Jun Wu chimeras; pig kidney → Rick Slayman), longer-lasting mushrooms, edited livestock, animal disease models.', '<b>Germline editing</b> = editing sperm, eggs, or embryos → change is in every cell and is inherited.', 'National Academy of Sciences: research on embryos/germ cells OK, but edited embryos <b>cannot be implanted</b> — no CRISPR babies.', '<b>He Jiankui</b> (2018) did it anyway (twins, CCR5 for HIV resistance) → 3 years in prison.'],
    watch: ['Cystic fibrosis is hard to fix in an adult (every cell carries the gene); easiest at the embryo stage — which raises consent and gene-pool concerns.'] },

  /* ---------- MOD 15–17: VIRUSES ---------- */
  vstruct: { title: 'Describe a virus\'s structure', hint: 'helical / polyhedral / complex, enveloped or naked', notes: 'm15',
    steps: ['Every virus: <b>nucleic acid</b> (DNA <i>or</i> RNA) inside a protein <b>capsid</b> made of <b>capsomeres</b>. 20–1,000 nm.', 'Shape: <b>helical</b> tube (TMV, Ebola) · <b>polyhedral</b> (HPV) · <b>complex</b> = polyhedral head + helical sheath + tail fibers (bacteriophage).', 'Envelope: <b>naked</b> (HPV) or <b>enveloped</b> — phospholipid bilayer with <b>spike proteins</b> for attachment (influenza, SARS-CoV-2, HIV).', 'Genome: dsDNA (HPV), ssDNA, dsRNA (rotavirus), ssRNA ± (coronavirus = +ssRNA); linear or circular; simple or <b>segmented</b> (influenza).'],
    watch: ['Influenza and SARS-CoV-2 have helical capsids inside their envelopes.'] },
  phage: { title: 'Lytic or lysogenic cycle?', hint: 'bacteriophage steps', q: 'Does the phage DNA integrate into the bacterial chromosome?', opts: ['ph_lyso', 'ph_lytic'] },
  ph_lytic: { title: 'No — straight to making phages', notes: 'm15', result: 'LYTIC',
    steps: ['<b>1 Attachment</b> — phage proteins bind the cell surface.', '<b>2 Penetration</b> — DNA injected (lysozyme gets it through the wall); the capsid stays outside.', '<b>3 Biosynthesis</b> — host copies phage DNA and makes phage proteins.', '<b>4 Maturation</b> (assembly) — parts assembled into virions.', '<b>5 Release</b> (lysis) — lysozyme bursts the cell; ~hundreds of phages escape.'],
    watch: ['Count phages with a <b>plaque assay</b>: each clear plaque in the bacterial lawn = one original phage.'] },
  ph_lyso: { title: 'Yes — it becomes a prophage', notes: 'm15', result: 'LYSOGENIC',
    steps: ['<b>1 Integration</b> — phage DNA joins the chromosome by recombination = <b>prophage</b>.', '<b>2 Reproduction</b> — the bacterium divides normally; every daughter cell gets the prophage.', '<b>3 Induction</b> — when the host is <b>stressed</b>, the prophage excises and enters the lytic cycle.'],
    watch: ['<b>Lysogenic conversion</b>: prophage genes change the bacterium\'s phenotype — <i>S. pyogenes</i> → scarlet fever toxin; <i>C. botulinum</i> → botulism toxin.'] },
  phagether: { title: 'Phage therapy vs antibiotics', hint: 'd\'Hérelle', notes: 'm15',
    steps: ['<b>Félix d\'Hérelle (1916)</b> discovered phages (filtrate of a dying culture made plaques) and treated WWI soldiers\' dysentery with filtered feces from healthy soldiers.', 'Antibiotics: non-specific (kill good bacteria), large doses for 10–14 days, resistance.', 'Phages: highly specific, small self-amplifying dose, self-eliminating; they can\'t infect human cells → safe.', 'Downside: you must identify the exact bacterium. Fecal transplants treat <i>C. difficile</i>.'] },
  entry: { title: 'How does the virus enter a eukaryotic cell?', hint: 'direct penetration · fusion · endocytosis', q: 'Does the virus have an envelope?', opts: ['en_naked', 'en_env'] },
  en_naked: { title: 'No — naked virus', q: 'What gets inside?', opts: ['en_dp', 'en_endo_n'] },
  en_dp: { title: 'Only the genome is injected', notes: 'm16', result: 'DIRECT PENETRATION', steps: ['Capsid attaches; genome is pushed into the cell (like a phage).', 'A few naked viruses; least common. Ex: <b>human enterovirus</b> (meningitis).', 'No uncoating needed — the capsid never enters.'] },
  en_endo_n: { title: 'The cell engulfs the whole virus', notes: 'm16', result: 'ENDOCYTOSIS', steps: ['Host cell wraps the virus in pseudopods → vesicle.', 'Then <b>uncoating</b> releases the genome.', 'Used by naked AND enveloped viruses; ex: <b>influenza</b>.'] },
  en_env: { title: 'Yes — enveloped virus', q: 'Does the envelope merge with the membrane, or does the cell engulf the virus?', opts: ['en_fus', 'en_endo_e'] },
  en_fus: { title: 'Envelope merges with the membrane', notes: 'm16', result: 'MEMBRANE FUSION', steps: ['The phospholipid envelope "melts" into the host membrane; the capsid drops into the cytoplasm.', 'Then <b>uncoating</b> releases the genome.', 'Ex: <b>SARS-CoV-2</b> and <b>HIV</b>.'] },
  en_endo_e: { title: 'The cell engulfs it', notes: 'm16', result: 'ENDOCYTOSIS', steps: ['Engulfed in a vesicle (pseudopods), released into the cytoplasm, then uncoated.', 'Ex: <b>influenza virus</b>.'] },
  infection: { title: 'Acute, latent, or persistent infection?', hint: 'cold · cold sores · HIV', q: 'Does it start making lots of new viruses right away?', opts: ['in_acute', 'in_wait'] },
  in_acute: { title: 'Yes — immediate productive phase', notes: 'm16', result: 'ACUTE', steps: ['Rapid spike in viruses (may lyse cells), then it resolves — like the lytic cycle.', 'Ex: <b>adenovirus</b> → common cold.'] },
  in_wait: { title: 'No — it hides first', q: 'Is the viral genome integrated INTO the host chromosome?', opts: ['in_pers', 'in_lat'] },
  in_pers: { title: 'Yes — as a provirus', notes: 'm16', result: 'PERSISTENT', steps: ['Viruses made at a <b>slow, detectable rate</b> without disease; may later become productive.', 'Ex: <b>HIV</b> — HIV-positive for years before AIDS.'] },
  in_lat: { title: 'No — sits beside it as episomal DNA', notes: 'm16', result: 'LATENT', steps: ['Dormant for months/years, then a productive phase; can recur.', 'Ex: <b>herpes simplex</b> (cold sores); <b>varicella-zoster</b>: chickenpox → later shingles (slides).'] },
  exit: { title: 'How does the virus leave the cell?', hint: 'lysis · budding · exocytosis', q: 'Is it naked or enveloped?', opts: ['xt_lysis', 'xt_env'] },
  xt_lysis: { title: 'Naked', notes: 'm16', result: 'LYSIS', bad: true, steps: ['The cell ruptures and viruses burst out — the cell is destroyed.'] },
  xt_env: { title: 'Enveloped', q: 'Is it SARS-CoV-2?', opts: ['xt_exo', 'xt_bud'] },
  xt_bud: { title: 'No — a typical enveloped virus (flu, HIV)', notes: 'm16', result: 'BUDDING', steps: ['Viral spike proteins go into the host membrane; the capsid pushes out and wraps itself in that membrane = its <b>envelope</b>.', 'A few buds → cell may survive; thousands → cell destroyed.', 'Flu needs <b>neuraminidase</b> to cut the tethers and lift off.'] },

<section id="n-m9"><h3>Module 9 — Protists</h3><ul>
<li><b>Endosymbiotic theory</b> (Lynn Margulis): engulfed aerobic bacteria → mitochondria; photosynthetic bacteria → chloroplasts. Evidence: rod shape 1–10 µm, double membrane, prokaryotic ribosomes, circular chromosome, binary fission, DNA like bacteria. Video: eukaryotes appear ~2 BYA; instructor slides: ~2.5 BYA. Eukaryotic cells 10–100 µm.</li>
<li>Protists = "miscellaneous" eukaryotes. <b>Protozoa</b> = unicellular heterotrophs (move by cilia, flagella, or pseudopods). <b>Algae</b> = autotrophs.</li>
<li><b>Trophozoite</b> = active feeding stage. <b>Cyst</b> = dormant, often transmitted.</li>
<li><b>Archaezoans</b> (2+ flagella, mitosomes, anaerobic): <i>Giardia</i> (2 nuclei, 8 flagella, cyst → fatty diarrhea; Leeuwenhoek saw it), <i>Trichomonas</i> (trophozoite only, STD → vaginitis).</li>
<li><b>Euglenozoans</b> (flagellum with protein rod): <i>Euglena</i> (auto + hetero, red-algae eye spot, harmless), <i>Trypanosoma</i> (blood; toxins → sleeping sickness).</li>
<li><b>Amoebozoans</b> (pseudopods): <i>Amoeba</i>, <i>Dictyostelium</i>, <i>Entamoeba histolytica</i> (amoebic dysentery — breaks intestinal tissue); <i>Dictyostelium</i> slime mold gathers by cyclic AMP.</li>
<li><b>Apicomplexans</b> (adults non-motile, obligate intracellular, apical organelles, complex life cycles): <i>Plasmodium</i> (malaria, <i>Anopheles</i>; blood → liver → RBCs → lysis → fever/chills; gametocytes back to mosquito; ~10% of world), <i>Cryptosporidium</i> (recreational diarrhea; chlorine-resistant).</li>
<li>Algae: <b>red tide</b> = neurotoxin dinoflagellate bloom (fish die-offs, shellfish poisoning). <b>Diatoms</b> = glass (silica) two-piece wall → diatomaceous earth (gardening, reflective paint, tooth polish); oil vacuoles for floating → petroleum / possible biofuel.</li>
<li>Drugs: <b>metronidazole (Flagyl)</b> blocks DNA synthesis; <b>chloroquine</b> blocks <i>Plasmodium</i> hemoglobin breakdown.</li>
</ul></section>
<section id="n-m10"><h3>Module 10 — Fungi</h3><ul>
<li>Fungi: uni- or multicellular, heterotrophic decomposers, non-motile, <b>chitin</b> cell wall; disease = <b>mycosis</b>.</li>
<li><b>Yeast</b>: unicellular, facultative anaerobe, <b>budding</b> (bud scar) or binary fission. <i>Candida albicans</i> is dimorphic (yeast at body temp). <b>Mold</b>: multicellular, aerobic, spores (asexual + sexual). Hyphae → mycelium. Dimorphic = two forms.</li>
<li><b>Sporangiospores</b> enclosed (sporangiophore; <i>Rhizopus</i>) vs <b>conidiospores</b> exposed (conidiophore; <i>Aspergillus</i>, <i>Penicillium</i>). Mushrooms = sexual (opposite mating types sense pheromones, hyphae fuse). <i>Rhizopus</i> and the Ascomycota spore facts come from the textbook.</li>
<li><i>S. cerevisiae</i>: CO₂ + ethanol. <i>Candida albicans</i>: yeast infection, thrush. <i>Aspergillus</i>: farmer's lung. <i>Penicillium chrysogenum</i>: penicillin (Fleming). Fungal meningitis: <i>Candida</i>, <i>Histoplasma</i>, <i>Cryptococcus</i> & others. <i>Histoplasma</i>: histoplasmosis (bat droppings, caves). Athlete's foot & ringworm: many fungi (ringworm isn't a worm). Nail infections.</li>
<li>Antifungals are hard (cells too similar). Targets: <b>ergosterol</b> (miconazole/Monistat) and <b>chitin wall</b> (anidulafungin/Eraxis). Humans use cholesterol, no wall.</li>
</ul></section>
<section id="n-m11"><h3>Module 11 — Helminths</h3><ul>
<li>Multicellular heterotrophs; cuticle of collagen + chitin (slides; lecture: indigestible chitin protects them); most harmless.</li>
<li><b>Cestodes</b> (tapeworms): flat, <b>proglottids</b> (hermaphroditic segments), <b>scolex</b> (hooked anchor); no mouth/gut — absorb nutrients; <i>Taenia</i>.</li>
<li><b>Trematodes</b> (flukes): flat, no proglottids/scolex, oral sucker, fluid feeders, host/organ-specific; <i>Clonorchis</i> (liver fluke).</li>
<li><b>Nematodes</b> (roundworms, incl. hookworms): round (hydrostatic skeleton), unsegmented; <i>Ascaris</i> (gut → blood → lungs → trachea → swallowed → intestines), <i>Enterobius</i> (pinworm; Scotch-tape test), <i>Dirofilaria</i> (heartworm, by mosquitoes), <i>Dracunculus</i> (Guinea worm), <i>C. elegans</i> (959 cells, 131 programmed deaths, 302 neurons).</li>
<li>Anticoagulants keep host blood flowing (hirudin = blood thinner). Helminthic therapy suppresses inflammation (allergies, Crohn's, IBS) — David Pritchard, 10 hookworms.</li>
<li><b>Mebendazole (Vermox)</b> inhibits sugar absorption. Slides: ascariasis treated with <b>albendazole (Albenza)</b> or mebendazole. Pyrantel / ivermectin targets: <i>not in the materials — ask</i>.</li>

<section id="n-m12"><h3>Module 12 — DNA structure &amp; replication</h3><ul>
<li>Gene = region encoding a protein's primary structure. Genotype (genes) → phenotype (traits).</li>
<li>Prokaryote: circular, one chromosome. Eukaryote: linear, many. Both dsDNA.</li>
<li>Griffith (heat-killed S + live R killed mice) → Avery (DNase stops it → DNA) → Hershey &amp; Chase (³²P DNA enters) → Franklin (Photo 51, double helix) → Watson &amp; Crick (model). Venter: artificial genome.</li>
<li>Nucleotide = phosphate + pentose + base. DNA: A T G C, deoxyribose. RNA: A U G C, ribose, single-stranded.</li>
<li>A–T (2 H-bonds), G–C (3). Covalent backbone. Antiparallel. 5′ = phosphate, 3′ = OH. Build only 5′→3′.</li>
<li>Replication (semi-conservative, ~30 min): gyrase uncoils → helicase unzips (fork) → primase RNA primer → DNA polymerase builds → ligase joins Okazaki fragments. Leading = continuous; lagging = fragments. Origin → two forks.</li>
<li><b>Cipro</b> inhibits bacterial gyrase. Coding strand 5′→3′ (= mRNA); template/non-coding 3′→5′.</li>
</ul></section>
<section id="n-m13"><h3>Module 13 — Gene expression, operons, mutations</h3><ul>
<li>Central dogma: DNA → mRNA (transcription) → protein (translation).</li>
<li>Transcription: RNA polymerase binds <b>promoter</b> (initiation) → builds mRNA off template (elongation) → <b>terminator</b> (termination).</li>
<li>Translation at ribosome: start codon <b>AUG</b> (Met) → tRNA anticodons pair with codons, peptide bonds → <b>stop codon</b> (no tRNA). 64 codons, 20 amino acids.</li>
<li>Operon (Monod) = repressor gene + promoter + operator + genes. <b>Inducible</b> (lac; default OFF; inducer/lactose inactivates repressor → ON). <b>Repressible</b> (trp; default ON; corepressor activates repressor → OFF).</li>
<li>Mutation = DNA sequence change; mutagens = chemicals, radiation, viruses. Point mutation = one nucleotide. Substitution → <b>silent</b> / <b>missense</b> / <b>nonsense</b>. Insertion/deletion → <b>frameshift</b>.</li>
<li>UV → <b>thymine dimers</b> → frameshift errors; 254 nm most germicidal; skin cancer.</li>
</ul></section>
<section id="n-m14"><h3>Module 14 — Genetic engineering</h3><ul>
<li>Vertical (to offspring) vs <b>horizontal</b> (within a generation, bacteria). Plasmids carry accessory genes.</li>
<li>Restriction enzymes cut at recognition sequences (EcoRI GAATTC) → sticky ends; ligase seals. Berg: first recombinant DNA (1970). Cohen &amp; Boyer: first recombinant organism (1973). Humulin = human insulin from <i>E. coli</i>.</li>
<li><b>PCR</b> (Mullis): denature ~96 °C → anneal primers ~55 °C → extend ~72 °C; 25–35 cycles; thermal cycler; Taq from <i>Thermus aquaticus</i>. Diagnostic: amplified = positive.</li>
<li><b>CRISPR</b> (Doudna &amp; Charpentier, 2020): bacterial anti-phage immunity → Cas9 cuts where guide RNA (~20 nt) matches. No donor → NHEJ → knock-out. Donor DNA → HDR → knock-in.</li>
<li>Uses: sickle cell (first FDA-approved), T cells vs cancer, pig organs, mushrooms, livestock. Germline editing: research OK, no implantation (He Jiankui jailed). Cystic fibrosis = faulty CFTR gene.</li>
</ul></section>
<section id="n-m15"><h3>Module 15 — Viruses I</h3><ul>
<li>Ivanovsky (1892, TMV filtrate). Stanley (1935, first seen/crystallized). Viruses = non-living obligate intracellular parasites, 20–1,000 nm.</li>
<li>Nucleic acid + capsid (capsomeres) ± envelope with spikes. Helical (TMV, Ebola), polyhedral (HPV), complex (phage). Genomes: dsDNA, ssDNA, dsRNA, ±ssRNA; linear/circular; simple/segmented.</li>
<li><b>Lytic</b>: attachment → penetration → biosynthesis → maturation → release (lysis; lysozyme). Plaque assay counts phages.</li>
<li><b>Lysogenic</b>: integration (prophage) → reproduction → induction (stress). Lysogenic conversion: <i>S. pyogenes</i> scarlet fever toxin; <i>C. botulinum</i> botulism toxin.</li>
<li>d'Hérelle (1916): phages + phage therapy. Phage therapy: specific, self-amplifying, self-eliminating; must ID the bacterium. Fecal transplants for <i>C. diff</i>.</li>
</ul></section>
<section id="n-m16"><h3>Module 16 — Viruses II</h3><ul>
<li>Narrow host range (spike ↔ receptor): HIV → CD4+ T cells; SARS-CoV-2 → ACE2.</li>
<li>Entry: direct penetration (few naked; enterovirus), membrane fusion (enveloped; SARS-CoV-2, HIV), endocytosis (either; influenza). Uncoating after fusion/endocytosis.</li>
<li>Infections: acute (adenovirus, cold), latent (episomal DNA; herpes simplex, VZV → shingles), persistent (provirus; HIV → AIDS).</li>
<li>Exit: lysis (naked), budding (enveloped; envelope = host membrane), exocytosis via de-acidified lysosomes (SARS-CoV-2).</li>
<li>Influenza: hemagglutinin (attach), neuraminidase (release); H1N1. Tamiflu = neuraminidase inhibitor (not for COVID). Remdesivir disrupts viral polymerase.</li>
<li>1918 flu: ~500 M infected, ~100 M dead, killed the healthy, mask mandates.</li>
</ul></section>
<section id="n-m17"><h3>Module 17 — Viruses III</h3><ul>
<li>+ssRNA = sense (translate directly). −ssRNA = antisense (copy to + first). Retroviruses (HIV, FIV): reverse transcriptase RNA → dsDNA → provirus → budding.</li>
<li>Biosynthesis: dsDNA (replicate, transcribe), ssDNA (make dsDNA first), dsRNA (RdRP: − strand → +RNA), +ssRNA (translate; copy via −), −ssRNA (make + first), ssRNA-RT (DNA provirus).</li>
<li>Culture: bacteriophage in bacteria; eukaryotic viruses in live animals, embryonated eggs (flu vaccine), cell cultures (HIV).</li>
<li>Rous (1911) chicken sarcoma filtrate → first virus–cancer link. Epstein &amp; Barr → first human (lymphoma).</li>
<li>Cell cycle G1 → S → G2 → M. Proto-oncogenes = gas; tumor suppressors (p53) = brakes. p53 "guardian angel", mutated in 60% of cancers. Oncoviruses inactivate p53: HPV (cervical), hepatitis B/C (liver).</li>
<li>HeLa cells: Henrietta Lacks, immortal, no consent; polio, cancer, AIDS research.</li>
</ul></section>

  else if (R.mode === 'misses') {
    var m = savedMisses();
    if (!m.length) { R.q = null; return; }
    var cands = m.filter(function (s) { return specKey(s) !== R.lastKey; });
    q = makeQ(rnd(cands.length ? cands : m));
  }
  while (!q && R.mode !== 'misses' && tries++ < 40) { var s = genSpec(DRILL.set); if (!s) break; if (specKey(s) === R.lastKey) continue; q = makeQ(s); }
  R.q = q; R.answered = false;
  if (q) R.lastKey = specKey(q.spec);
}
function renderDrill(h) {
  var parts = h.split('/');
  if (parts[1] === 'go' && parts[2]) { newRun(parts[2]); nextQ(); history.replaceState(null, '', '#/drill/run'); return renderDrillRun(); }
  if (parts[1] === 'run' && DRILL.run) return renderDrillRun();
  renderDrillSetup();
}
function tog(key, label, on, sub) { return '<label class="tog"><input type="checkbox" data-t="' + key + '"' + (on ? ' checked' : '') + '><span>' + label + (sub ? '<small>' + sub + '</small>' : '') + '</span></label>'; }
function renderDrillSetup() {
  var S = DRILL.set, mc = savedMisses().length, best = LS.get('best', 0);
  var cnt = function (m) { return FACTS.filter(function (f) { return f.m === m; }).length; };
  var html = '<nav class="trail"><a href="#/" class="crumb">Start</a><span class="sep">›</span><span class="crumb here">Drill</span></nav>';
  html += '<section class="hero"><p class="eyebrow">Memorize</p><h1>Drill Modules 9–17</h1><p class="lede">Quick-fire questions. Anything you miss comes back a few questions later and stays on your miss list until you get it right.' + (best ? ' Best streak: <b>' + best + '</b>.' : '') + '</p></section>';
  html += '<div class="drillgrid">';
  html += '<section class="card dcard tag-virus"><h2>Modules</h2><div class="navrow small"><button type="button" class="btn small" id="allM">All</button><button type="button" class="btn small" id="noneM">None</button></div><div class="togs">' + MODS.map(function (m) { return tog('m_' + m, 'Module ' + m + ' — ' + MOD_NAME[m], S.mods[m], cnt(m) + ' questions'); }).join('') + '</div></section>';
  html += '<section class="card dcard tag-gene"><h2>Sequence &amp; problem practice</h2><p class="hint">Freshly generated every time — works the skills, not memory.</p><div class="togs">' + Object.keys(GEN_KINDS).map(function (k) { return tog('g_' + k, GEN_KINDS[k], S.gens[k]); }).join('') + tog('weightSeq', 'Show these more often', S.weightSeq, 'doubles how often a problem comes up') + '</div></section>';
  html += '</div><div class="navrow"><a class="btn primary" href="#/drill/go/mixed">Start drill</a>' + (mc ? '<a class="btn" href="#/drill/go/misses">Practice my misses (' + mc + ')</a><button type="button" class="btn ghost" id="clearMiss">Clear miss list</button>' : '') + '</div>';
  app.innerHTML = html;
  app.querySelectorAll('.tog input').forEach(function (i) {
    i.addEventListener('change', function () {
      var k = i.dataset.t;
      if (k.indexOf('m_') === 0) DRILL.set.mods[k.slice(2)] = i.checked;
      else if (k.indexOf('g_') === 0) DRILL.set.gens[k.slice(2)] = i.checked;
      else DRILL.set[k] = i.checked;
      LS.set('set', DRILL.set);
    });
  });
  function setAll(v) { MODS.forEach(function (m) { DRILL.set.mods[m] = v; }); LS.set('set', DRILL.set); renderDrillSetup(); }
  document.getElementById('allM').addEventListener('click', function () { setAll(true); });
  document.getElementById('noneM').addEventListener('click', function () { setAll(false); });
  var cm = document.getElementById('clearMiss'); if (cm) cm.addEventListener('click', function () { LS.set('misses', []); renderDrillSetup(); });
}
function scoreHTML(R) { return '<span><b>' + R.right + '</b> / ' + R.n + ' right</span><span>Streak <b>' + R.streak + '</b></span><span>Best <b>' + Math.max(LS.get('best', 0), R.streak) + '</b></span><span class="dim">' + (R.queue.length ? R.queue.length + ' coming back' : '') + '</span><a class="btn small" href="#/drill">Settings</a>'; }
function renderDrillRun() {
  var R = DRILL.run, q = R.q;
  var title = { mixed: 'Drill', misses: 'Practicing misses' }[R.mode] || 'Drill';
  var html = '<nav class="trail"><a href="#/" class="crumb">Start</a><span class="sep">›</span><a href="#/drill" class="crumb">Drill</a><span class="sep">›</span><span class="crumb here">' + title + '</span></nav>';
  html += '<div class="scorebar">' + scoreHTML(R) + '</div>';
  if (!q) {
    html += '<div class="card"><h1>' + (R.mode === 'misses' ? 'Miss list cleared' : 'Nothing to drill') + '</h1><p class="lede">' + (R.mode === 'misses' ? 'You\'ve answered every saved miss correctly.' : 'Turn on at least one module or problem type in Settings.') + '</p><div class="navrow"><a class="btn" href="#/drill">Settings</a></div></div>';
    app.innerHTML = html; return;
  }
  html += '<div class="card dq"><p class="eyebrow">' + esc(q.tag) + (q.retry ? ' · <span class="again">again</span>' : '') + '</p>' + (q.prompt ? '<p class="qprompt">' + esc(q.prompt) + '</p>' : '') + '<div class="qbig' + (q.small ? ' qmed' : '') + '">' + q.big + '</div>';
  if (q.type === 'mc') html += '<div class="mc' + (q.opts.some(function (o) { return o.length > 28; }) ? ' wide' : '') + '">' + q.opts.map(function (o, i) { return '<button type="button" data-o="' + esc(o) + '"><span class="k">' + (i < 9 ? i + 1 : '') + '</span>' + esc(o) + '</button>'; }).join('') + '</div>';
  else html += '<form class="ta" autocomplete="off"><input id="ans" class="mono" placeholder="' + esc(q.ph) + '" autocapitalize="characters" autocorrect="off" spellcheck="false"><button class="btn primary" type="submit">Check</button><button class="btn ghost" type="button" id="idk">Show answer</button></form>';
  html += '<div id="fb"></div></div>';
  if (R.misses.length) html += '<details class="card ref"><summary>Missed this round (' + R.misses.length + ')</summary><ul class="why">' + R.misses.map(function (m) { return '<li>' + m.big + ' → <b>' + m.ans + '</b></li>'; }).join('') + '</ul></details>';
  app.innerHTML = html;
  if (q.type === 'mc') {
    app.querySelectorAll('.mc button').forEach(function (b) { b.addEventListener('click', function () { if (!R.answered) grade(b.dataset.o === q.answer, b.dataset.o); }); });
  } else {
    var inp = document.getElementById('ans');
    if (window.matchMedia('(pointer:fine)').matches) inp.focus();
    app.querySelector('form.ta').addEventListener('submit', function (e) {
      e.preventDefault();
      if (R.answered) { advance(); return; }
      var r = q.check(q, inp.value);
      if (!r.ok && /first\.$/.test(r.msg || '')) { showFb('<p class="cmp cmp-bad">' + esc(r.msg) + '</p>'); return; }
      grade(r.ok, inp.value, r.msg);
    });
    document.getElementById('idk').addEventListener('click', function () { if (!R.answered) grade(false, '', 'Skipped.'); });
  }
}
function showFb(h) { document.getElementById('fb').innerHTML = h; }
function grade(ok, given, msg) {
  var R = DRILL.run, q = R.q;
  R.answered = true; R.n++;
  if (ok) { R.right++; R.streak++; if (R.streak > LS.get('best', 0)) LS.set('best', R.streak); removeSavedMiss(q.spec); }
  else { R.streak = 0; R.queue.push({ spec: q.spec, due: R.n + 3 }); addSavedMiss(q.spec); R.misses.push({ big: q.big, ans: q.answerHTML || esc(q.answer) }); }
  if (q.type === 'mc') {
    app.querySelectorAll('.mc button').forEach(function (b) {
      b.disabled = true;
      if (b.dataset.o === q.answer) b.classList.add('right');
      else if (b.dataset.o === given) b.classList.add('wrong');
    });
  } else { var i = document.getElementById('ans'); i.readOnly = true; i.classList.add(ok ? 'ok' : 'bad'); }
  var fb = '<div class="res ' + (ok ? 'res-ok' : '') + '">' + (ok ? '<p class="verdict v-ok">Correct</p>' : '<p class="verdict v-bad">' + (given === '' ? 'Answer' : 'Not quite') + '</p>' + (msg && msg !== 'Skipped.' ? '<p><b>' + esc(msg) + '</b></p>' : '') + (q.type === 'text' ? '<p class="ansv">' + (q.answerHTML || esc(q.answer)) + '</p>' : '<p>Answer: <b>' + esc(q.answer) + '</b></p>'));
  if (q.why && q.why.length) fb += '<ul class="why">' + q.why.map(function (w) { return '<li>' + w + '</li>'; }).join('') + '</ul>';
  fb += '<button type="button" class="btn primary" id="nextq">Next <span class="kbd">(Enter)</span></button></div>';
  showFb(fb);
  document.getElementById('nextq').addEventListener('click', advance);
  var sb = app.querySelector('.scorebar'); if (sb) sb.innerHTML = scoreHTML(R);
  if (window.matchMedia('(pointer:fine)').matches) document.getElementById('nextq').focus();
}
function advance() { nextQ(); renderDrillRun(); window.scrollTo(0, 0); }
document.addEventListener('keydown', function (e) {
  if (!DRILL.run || location.hash.indexOf('#/drill/run') !== 0) return;
  var R = DRILL.run, q = R.q; if (!q) return;
  if (e.target && e.target.tagName === 'INPUT') return;
  if (R.answered && e.key === 'Enter') { e.preventDefault(); advance(); return; }
  if (!R.answered && q.type === 'mc' && /^[1-9]$/.test(e.key)) { var b = app.querySelectorAll('.mc button')[+e.key - 1]; if (b) b.click(); }
});

window.addEventListener('hashchange', render);
document.addEventListener('DOMContentLoaded', function () { app = document.getElementById('app'); render(); });
(function () { var b = document.getElementById('theme'), r = document.documentElement; try { var s = localStorage.getItem('microdrill_theme'); if (s) r.dataset.theme = s; } catch (e) { } b.addEventListener('click', function () { var dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('microdrill_theme', r.dataset.theme); } catch (e) { } }); })();
